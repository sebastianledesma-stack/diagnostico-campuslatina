[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"
  # react-pdf trae binarios/wasm propios: se despliega como node_module en lugar de bundlearse
  external_node_modules = ["@react-pdf/renderer"]
  # pdfkit carga sus fuentes estándar con require dinámico, que el bundler no detecta
  included_files = ["node_modules/pdfkit/js/standard-fonts/**"]

# Un solo dominio para buscadores: el subdominio de Netlify redirige (301) al dominio propio.
[[redirects]]
  from = "https://diagnostico-campuslatina.netlify.app/*"
  to = "https://diagnostico.campuslatina.com/:splat"
  status = 301
  force = true

# SPA: /admin se sirve con index.html y lo resuelve React Router.
# No se usa un comodín "/*" para no interferir con /api/*, que atienden las functions por su config.path.
[[redirects]]
  from = "/admin"
  to = "/index.html"
  status = 200

[[redirects]]
  from = "/admin/*"
  to = "/index.html"
  status = 200

# Diagnósticos compartidos por link secreto: también los resuelve React Router.
[[redirects]]
  from = "/d/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Panel y API fuera de los buscadores
[[headers]]
  for = "/admin*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Links privados de cada diagnóstico: fuera de buscadores y sin filtrar la URL a otros sitios.
[[headers]]
  for = "/d/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    Referrer-Policy = "no-referrer"

[[headers]]
  for = "/api/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

# Archivos para buscadores y modelos de lenguaje
[[headers]]
  for = "/llms*.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=utf-8"
